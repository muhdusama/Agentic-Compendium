name: Validate app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install Python runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate public source and Python regressions
        run: |
          python scripts/check-publication.py
          python -m unittest discover -s server/tests -v
          node --check server/web/app.js
          node --check server/web/rich-text.js
          node --check server/web/sw.js
          node server/tests/service-worker.cjs
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/compendium-browser" --no-audit --no-fund --save-exact playwright@1.62.1
          "$RUNNER_TEMP/compendium-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise app with disposable data
        env:
          PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/compendium-browser/node_modules/playwright
        run: python scripts/browser-smoke.py
      - name: Build container and verify private files stay outside the image
        run: |
          mkdir -p server/web/not-for-release
          printf 'disposable test data\n' > server/web/not-for-release/local.sqlite
          printf 'disposable test data\n' > server/local.pem
          docker build -t agentic-compendium:test .
          docker run --rm --entrypoint sh agentic-compendium:test -c 'test ! -e /app/server/local.pem && test ! -e /app/server/web/not-for-release/local.sqlite'
          docker build -t agentic-compendium:context-audit -f - . <<'DOCKERFILE'
          FROM python:3.13-alpine
          COPY . /audit/
          RUN test -f /audit/server/web/app.js && test ! -e /audit/server/local.pem && test ! -e /audit/server/web/not-for-release/local.sqlite
          DOCKERFILE
      - name: Validate optional DNS deployment configuration
        run: |
          docker compose --env-file .env.example config --format json > "$RUNNER_TEMP/compose-default.json"
          cp .env.example "$RUNNER_TEMP/compose-dns.env"
          cat >> "$RUNNER_TEMP/compose-dns.env" <<'ENV'
          APP_DNS_SERVER=203.0.113.53
          COMPOSE_FILE=compose.yaml:compose.dns.yaml
          ENV
          docker compose --env-file "$RUNNER_TEMP/compose-dns.env" config --format json > "$RUNNER_TEMP/compose-dns.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          baseline = json.loads((root / 'compose-default.json').read_text())
          override = json.loads((root / 'compose-dns.json').read_text())
          assert override['services']['delivery-service'].pop('dns') == ['203.0.113.53']
          assert override == baseline, 'DNS override changed unrelated deployment settings'
          PY
          if APP_DNS_SERVER='' docker compose --env-file .env.example -f compose.yaml -f compose.dns.yaml config --quiet 2> "$RUNNER_TEMP/missing-dns.log"; then
            echo "DNS override incorrectly accepted a missing resolver"
            exit 1
          fi
